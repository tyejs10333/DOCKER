
name: stopka

services:
  
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stopka}
      POSTGRES_DB: ${POSTGRES_DB:-stopka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Не задан POSTGRES_PASSWORD в файле .env}
    volumes:
      
      - pgdata:/var/lib/postgresql/data
    
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      STATIC_DIR: /app/frontend
      DATABASE_URL: postgres://${POSTGRES_USER:-stopka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stopka}?sslmode=disable
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
